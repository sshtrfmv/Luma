name: Build Luma
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: luma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Publication checks
        run: python3 tools/check-publication.py
      - name: Diagnostic tool tests
        run: python3 -m unittest discover -s tools/tests
      - name: Android SDK
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 
      - name: Build, lint and Java regressions
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:lintDebug jvmRegression
      - name: Upload debug APK and lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Luma-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 7
